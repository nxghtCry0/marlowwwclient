plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

tasks.matching { it.name == "jar" || it.name == "remapJar" || it.name == "remapClientJar" }.configureEach {
    archiveFileName = "marlowwwclient-v4.5.jar"
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "imnotcheatingyouare" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            vmArg "--enable-native-access=ALL-UNNAMED"
            vmArg "-Doshi.os.windows.perfos.disabled=true"
            vmArg "-Doshi.os.windows.perfproc.disabled=true"
            vmArg "-Doshi.os.windows.perfdisk.disabled=true"
            vmArg "-Dorg.joml.unsafe=false"
            vmArg "-Duser.language=en"
            vmArg "-Duser.country=US"
            vmArg "-XX:ErrorFile=${project.projectDir}/run/hs_err_%p.log"
            vmArg "-XX:+CreateMinidumpOnCrash"
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // LWJGL NanoVG
    implementation "org.lwjgl:lwjgl-nanovg:3.4.1"
    runtimeOnly "org.lwjgl:lwjgl-nanovg:3.4.1:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-nanovg:3.4.1:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-nanovg:3.4.1:natives-macos"

    implementation "io.github.spair:imgui-java-binding:1.86.10"
    implementation("io.github.spair:imgui-java-lwjgl3:1.86.10") {
        exclude group: "org.lwjgl"
    }
    runtimeOnly "io.github.spair:imgui-java-natives-windows:1.86.10"
    runtimeOnly "io.github.spair:imgui-java-natives-linux:1.86.10"
    runtimeOnly "io.github.spair:imgui-java-natives-macos:1.86.10"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

// Compiled bytecode is kept at Java 21 (class file v65) even though the game itself now
// requires a Java 25 runtime: Sponge Mixin 0.8.7's bundled ASM only fully supports up to
// class file version 65, and targeting 25 here made every one of this mod's mixins emit
// "Class version 69 required is higher than the class version supported" warnings, which
// caused native instability under Mixin's concurrent bytecode transformation. Java 21
// class files run fine on the JDK 25 the game launches with.
def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    it.options.compilerArgs << "-Xlint:deprecation"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs("--enable-native-access=ALL-UNNAMED", "-Doshi.os.windows.perfos.disabled=true", "-Dorg.joml.unsafe=false")
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    from({
        configurations.clientRuntimeClasspath.filter { file ->
            file.name.contains("imgui") || file.name.contains("nanovg")
        }.collect { zipTree(it) }
    }) {
        exclude "META-INF/MANIFEST.MF", "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

publishing {
    // configure the maven publication
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

// Gradle itself (its Groovy build-script evaluation) needs org.gradle.java.home to stay on a
// JDK the bundled Groovy/Gradle version supports (JDK 25 here; JDK 26 class files aren't
// supported yet and fail with "Unsupported class file major version 70").
//
// The actual game client is a separate forked JVM and has no such constraint. JDK 25.0.3.9's
// JIT compiler was found to crash natively and non-deterministically (STATUS_ACCESS_VIOLATION /
// STATUS_STACK_BUFFER_OVERRUN, no Java exception, no hs_err) partway through the client's
// startup — reproducible several times, and confirmed JIT-related since running with -Xint
// (interpreter only) was stable. JDK 26.0.2 does not exhibit the crash with normal JIT enabled,
// so runClient launches on it instead. Override with MOD_RUN_JAVA_HOME if that install path
// differs on your machine, or if a newer JDK 25 patch fixes the underlying bug.
def runClientJavaHome = System.getenv("MOD_RUN_JAVA_HOME") ?: "C:/Program Files/Java/jdk-26.0.2"
if (new File(runClientJavaHome, "bin/java.exe").exists()) {
    tasks.named("runClient") {
        executable(new File(runClientJavaHome, "bin/java.exe").absolutePath)
    }
}

